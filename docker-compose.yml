# =============================================================================
# Sunlens Camera - he thong thue thiet bi may anh
# 3 dich vu: MySQL (db) + FastAPI backend (:8000) + nginx frontend tinh (:5500)
#
# Chay:   docker compose up -d --build
# Xem:    Frontend  http://127.0.0.1:5500
#         API/Docs  http://127.0.0.1:8000/docs
# Reset:  docker compose down -v   (xoa luon du lieu DB de seed lai tu dau)
# =============================================================================
name: sunlens-camera

services:
  # --------------------------- MySQL ---------------------------
  db:
    image: mysql:8.4
    container_name: sunlens-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"      # khop DB_PASSWORD trong backend
      MYSQL_DATABASE: do_an_tot_nghiep
      TZ: Asia/Ho_Chi_Minh
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # QUAN TRONG: dump tao bang chu thuong (don_thue) nhung model/migration dung
      # chu HOA (DON_THUE). Windows MySQL mac dinh khong phan biet hoa/thuong;
      # tren Linux phai bat che do nay (chi co tac dung khi khoi tao volume lan dau).
      - --lower-case-table-names=1
    ports:
      - "${DB_HOST_PORT:-3307}:3306"      # 3307 tren host de tranh dung MySQL local 3306
    volumes:
      - db_data:/var/lib/mysql
      # Seed schema + du lieu mau (chi chay LAN DAU khi volume con rong).
      # Dump nay stamp alembic_version = 20260618_0018; backend se upgrade -> 0021.
      - ./do_an_tot_nghiep.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  # --------------------------- Backend FastAPI ---------------------------
  backend:
    build:
      context: ./DoAnTotNghiep_BackEnd/Backend
    container_name: sunlens-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy        # cho DB seed xong moi chay migration
    # Tai bien moi truong tu .env (chua secrets Google/Facebook/VNPay/Resend).
    # .env KHONG nam trong git/image - phai co san tren dia (copy tu .env.example).
    env_file:
      - path: ./DoAnTotNghiep_BackEnd/Backend/.env
        required: false
    environment:
      # Ghi de cho moi truong container (uu tien hon env_file)
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: "123456"
      DB_NAME: do_an_tot_nghiep
      APP_ENV: production
      APP_DEBUG: "false"
      TZ: Asia/Ho_Chi_Minh
      # allow_credentials=True nen KHONG dung "*"; liet ke ro origin frontend
      CORS_ORIGINS: '["http://localhost:5500","http://127.0.0.1:5500","http://localhost:3000","http://127.0.0.1:3000"]'
      # JWT (>=16 ky tu). Luu y: 'environment' uu tien HON 'env_file', nen 2 gia tri
      # nay se duoc dung (ghi de placeholder trong .env) -> app luon khoi dong duoc.
      # DOI sang chuoi bi mat that cua ban truoc khi chay that.
      JWT_SECRET_KEY: "doi-thanh-secret-that-cua-ban-1234567890"
      JWT_REFRESH_SECRET_KEY: "doi-thanh-refresh-secret-that-1234567890"
    ports:
      # Giu mac dinh 8000 vi frontend hardcode goi API toi 127.0.0.1:8000.
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      # Volume CHUNG voi nginx: backend ghi anh thiet bi/CCCD/avatar vao day,
      # nginx phuc vu lai cho trinh duyet. Phai dung dung duong dan /workspace/...
      - ./DOANTOTNGHIEP_FrontEnd:/workspace/DOANTOTNGHIEP_FrontEnd
      # Giu lai anh da upload qua /uploads
      - ./DoAnTotNghiep_BackEnd/Backend/uploads:/workspace/DoAnTotNghiep_BackEnd/Backend/uploads

  # --------------------------- Frontend nginx ---------------------------
  frontend:
    image: nginx:1.27-alpine
    container_name: sunlens-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST_PORT:-5500}:80"
    volumes:
      # Cung thu muc frontend voi backend (backend ghi anh, nginx chi doc)
      - ./DOANTOTNGHIEP_FrontEnd:/usr/share/nginx/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  # --------------------------- n8n (chatbot AI text-to-SQL) ---------------------------
  # Chat widget -> POST http://127.0.0.1:5678/webhook/chat -> workflow -> tra JSON ve.
  # n8n ket noi MySQL qua mang noi bo: Host=db, Port=3306, DB=do_an_tot_nghiep, user=root/123456.
  n8n:
    image: n8nio/n8n:latest
    container_name: sunlens-n8n
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${N8N_HOST_PORT:-5678}:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_SECURE_COOKIE=false          # cho phep mo UI qua http://localhost
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_RUNNERS_ENABLED=true
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - n8n_data:/home/node/.n8n
      # Mount san file workflow de tien import trong UI (Import from File)
      - ./n8n:/workflows:ro

volumes:
  db_data:
  n8n_data:
