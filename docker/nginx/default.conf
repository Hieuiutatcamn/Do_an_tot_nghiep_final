# nginx phuc vu frontend tinh (user + admin) tren cong 80 (map ra 5500).
# Document root = DOANTOTNGHIEP_FrontEnd  ->  URL /Webthuemayanh_FE/... khop dia chi
# duoc hardcode trong backend (OAuth, VNPay return) va trong JS frontend.
server {
    listen 80;
    server_name localhost;

    charset utf-8;
    source_charset utf-8;
    charset_types text/html text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;

    # Cho phep upload lon (anh thiet bi/CCCD di qua backend, nhung de an toan)
    client_max_body_size 20m;

    # Vao "/" thi chuyen toi trang chu nguoi dung cho tien
    location = / {
        return 302 /Webthuemayanh_FE/user/Sunlens_Camera/index.html;
    }

    # An file an: .git, .idea, .env ... (tru .well-known)
    location ~ /\.(?!well-known) {
        deny all;
    }

    # An script dev khong dung khi serve tinh
    location ~* /(upload_api|temp_check_html)\.py$ {
        deny all;
    }

    # HTML / JS / CSS: luon revalidate (tranh trinh duyet giu code cu khi dev/demo)
    location ~* \.(?:html|js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Anh / font: cache dai (it thay doi)
    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Cac trang .html va phan con lai
    location / {
        try_files $uri $uri/ =404;
        autoindex off;
    }
}
